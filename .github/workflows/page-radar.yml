# Checks your official pages every Monday and opens a GitHub Issue (GitHub emails you) when any page changed.
# It never edits your data. It only remembers what the pages looked like (tools/radar_state/ci.json).
name: Page radar

on:
  schedule:
    - cron: "0 5 * * 1"        # every Monday, 05:00 UTC
  workflow_dispatch:           # also lets you start it by hand: Actions tab > Page radar > Run workflow

permissions:
  contents: write              # to save the page memory
  issues: write                # to open the issue

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Look at every page in the list
        run: python tools/watch_pages.py tools/watch_list.csv --state tools/radar_state/ci.json --report

      - name: Save what the pages looked like
        run: |
          git config user.name "page-radar"
          git config user.email "page-radar@users.noreply.github.com"
          git add tools/radar_state/ci.json
          git diff --cached --quiet || git commit -m "Page radar: update page memory [skip ci]"
          git pull --rebase
          git push

      - name: Open an issue when pages changed
        if: hashFiles('tools/radar_report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Page radar - pages changed $(date +%F)" --body-file tools/radar_report.md
